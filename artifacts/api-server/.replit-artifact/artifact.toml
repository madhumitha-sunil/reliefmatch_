kind = "api"
previewPath = "/"
title = "ReliefMatch"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "API Server"
paths = ["/"]

[services.development]
run = "python app.py"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "-q", "app.py", "db.py", "logic.py"]

[services.production.run]
args = ["python", "app.py"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/login"
